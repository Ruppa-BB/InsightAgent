<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InsightAgent · 数据质量管理</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/data.css"><script src="/static/quality.js" defer></script></head><body>
<header class="site-header"><div class="header-inner"><a class="brand" href="/">Insight<span class="brand-light">Agent</span></a><nav aria-label="工作台导航"><a class="quiet-button" href="/data">资产目录</a><a class="quiet-button" href="/">分析工作台 ↗</a><a class="quiet-button" href="/data/metrics">指标口径</a><a class="quiet-button" href="/data/issues">质量问题</a><a class="quiet-button" href="/data/lineage">数据血缘</a></nav></div></header>
<main class="catalog-main"><p class="eyebrow">DATA QUALITY / ONLINE RETAIL II</p><div class="catalog-heading"><div><h1>让每次检查，<br><span>都有据可查。</span></h1><p>八项硬质量规则 · 配置版本 · 检查历史 · 有限问题样例</p></div><button id="run-quality" type="button" class="primary-button">运行并保存检查 ↗</button></div><p id="quality-status" role="status" aria-live="polite"></p>
<p><label for="dataset-version">新检查的数据版本</label><select id="dataset-version"></select></p><p class="catalog-warning">通知阈值只控制关注标记；发现违规仍阻断 Agent 分析。无交易日不等于缺失记录，成本和毛利仍不可用。</p>
<details class="catalog-panel"><summary>检查配置与通知阈值</summary><form id="quality-config"><p id="config-version"></p><label for="sample-limit">每项规则最多保存的样例数（1～20）</label><input id="sample-limit" type="number" min="1" max="20" required><div id="rule-configs"></div><button class="outline-button" id="save-config" type="submit">保存新配置版本</button></form></details>
<div class="catalog-layout" style="margin-top:28px"><aside><h2>检查历史</h2><div id="quality-history"></div></aside><section id="quality-result" class="catalog-panel"><p>运行检查后，查看统计与问题样例。已有记录重开不会查询经营数据库。</p></section></div>
<section class="catalog-boundary"><h2>比较检查结果</h2><form id="quality-compare"><label for="compare-before">此前检查</label><select id="compare-before" required></select><label for="compare-after">当前检查</label><select id="compare-after" required></select><button type="submit" class="outline-button">比较违规数量</button></form><div id="compare-result"></div><p>只比较相同数据集和登记版本的完成记录。配置变化不能被当作数据质量改善。</p></section></main></body></html>
